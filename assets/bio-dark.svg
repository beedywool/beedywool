  <text x="28" y="50" font-size="17" font-weight="500" fill="#D0BCFF">Hi, I'm Beedy</text>
  <text x="28" y="94" font-size="22" fill="#E6E0E9"><tspan x="28" dy="0">I&#x27;m a full stack developer cumulating 10+ years of experience in</tspan><tspan x="28" dy="32">development, starting with video games in middle school. My goal is</tspan><tspan x="28" dy="32">to create innovative and immersives experiences spanning into the</tspan><tspan x="28" dy="32">real world with AR and VR technologies to make it a little bit</tspan><tspan x="28" dy="32">livelier, even for just a few minutes. The old spark technology used</tspan><tspan x="28" dy="32">to have is what I am seeking.</tspan></text>
