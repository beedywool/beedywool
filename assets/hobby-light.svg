  <text x="124" y="88" font-size="20" fill="#1D1B20"><tspan x="124" dy="0">When I&#x27;m not coding, I&#x27;m usually planning the next trip. Discovering new</tspan><tspan x="124" dy="30">places, cultures and food is where I find most of my inspiration, so</tspan><tspan x="124" dy="30">here&#x27;s a little travel album.</tspan></text>
